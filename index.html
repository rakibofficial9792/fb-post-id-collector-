<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

body{
font-family:'Inter',sans-serif;
background:#0b1120;
background-image:
radial-gradient(circle at top left,#1e3a8a33,transparent 30%),
radial-gradient(circle at bottom right,#06b6d433,transparent 30%);
color:white;
padding:20px;
margin:0;
min-height:100vh;
}

.container{
max-width:950px;
margin:auto;
background:rgba(17,24,39,0.75);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.08);
padding:24px;
border-radius:24px;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

h1{
text-align:center;
margin-bottom:25px;
font-size:32px;
font-weight:800;
background:linear-gradient(90deg,#60a5fa,#22d3ee);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.notice{
background:rgba(34,197,94,0.12);
border:1px solid rgba(34,197,94,0.4);
padding:14px;
border-radius:16px;
margin-bottom:20px;
color:#86efac;
line-height:1.6;
}

.login-box{
margin-bottom:25px;
padding:22px;
border-radius:20px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.05);
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:#cbd5e1;
}

input,
select{
width:100%;
padding:14px;
margin-bottom:18px;
border:none;
border-radius:14px;
box-sizing:border-box;
background:#111827;
color:white;
border:1px solid rgba(255,255,255,0.08);
font-size:15px;
transition:0.25s;
}

input:focus,
select:focus{
outline:none;
border:1px solid #38bdf8;
box-shadow:0 0 15px rgba(56,189,248,0.35);
}

button{
width:100%;
padding:14px;
margin-bottom:16px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#2563eb,#06b6d4);
color:white;
cursor:pointer;
font-size:15px;
font-weight:700;
transition:0.25s;
}

button:hover{
transform:translateY(-2px);
opacity:0.95;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:22px;
}

.tabs button{
background:#111827;
border:1px solid rgba(255,255,255,0.08);
}

.tabs button.active{
background:linear-gradient(135deg,#2563eb,#06b6d4);
}

.post{
background:rgba(255,255,255,0.04);
padding:16px;
border-radius:20px;
margin-bottom:16px;
display:flex;
gap:14px;
align-items:flex-start;
border:1px solid rgba(255,255,255,0.06);
transition:0.25s;
}

.post:hover{
transform:translateY(-2px);
border-color:#38bdf8;
box-shadow:0 0 20px rgba(56,189,248,0.15);
}

.post img{
width:95px;
height:95px;
object-fit:cover;
border-radius:14px;
}

.post-info{
flex:1;
word-break:break-word;
}

.caption{
color:#7dd3fc;
margin-bottom:10px;
font-weight:700;
line-height:1.4;
}

.copy-btn{
width:auto;
background:linear-gradient(135deg,#22c55e,#16a34a);
padding:10px 16px;
border-radius:12px;
}

.copy-btn:hover{
box-shadow:0 0 15px rgba(34,197,94,0.4);
}

.download-btn{
background:linear-gradient(135deg,#22c55e,#16a34a);
}

.clear-btn{
background:linear-gradient(135deg,#ef4444,#dc2626);
}

.total{
margin:18px 0;
font-size:18px;
color:#67e8f9;
font-weight:700;
}

.loading{
text-align:center;
padding:20px;
font-size:18px;
}

.open-link{
color:#38bdf8;
text-decoration:none;
font-weight:600;
}

.open-link:hover{
text-decoration:underline;
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#1e3a8a;
border-radius:20px;
}

@media(max-width:700px){

body{
padding:14px;
}

.container{
padding:18px;
border-radius:20px;
}

h1{
font-size:26px;
}

.post{
flex-direction:column;
}

.post img{
width:100%;
height:auto;
max-height:250px;
}

.copy-btn{
width:100%;
}

.tabs{
flex-direction:column;
}

}

</style>
